<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Poetas Brasileiros e suas Obras</title>
</head>
<body>
    <header>
        <h1>Poetas Brasileiros e suas Obras <span role="img" aria-label="poetry">📚</span></h1>
    </header>
    <main>
        <section class="pesquisa" role="search">
            <input type="text" placeholder="Digite o nome do poeta ou título da obra" id="campo-pesquisa" aria-label="Pesquisar poetas ou obras">
            <button onclick="pesquisar()" aria-label="Pesquisar">Pesquisar</button>
            <button onclick="limparPesquisa()" aria-label="Limpar pesquisa">Limpar</button>
        </section>
        <section class="resultados-pesquisa" id="resultados-pesquisa" aria-live="polite">
            <div class="loading" id="loading" style="display: none;">Carregando...</div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 - Poetas Brasileiros. Todos os direitos reservados.</p>
        <p>Entre em contato pelo e-mail: <a href="mailto:alexiabcamargo@gmail.com">alexiabcamargo@gmail.com</a></p>
    </footer>
    <script src="dados.js"></script>
    <script src="app.js"></script>
</body>
</html>
